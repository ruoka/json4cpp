name: "setup-llvm"
description: "Install LLVM 21 libc++ when the runner has clang without the module headers."
inputs:
  packages:
    description: "Space-separated apt packages to install when libc++ headers are missing"
    required: false
    default: "libc++-21-dev libc++abi-21-dev clang-21 lld-21 lldb-21 jq clang-tools-21"

runs:
  using: "composite"
  steps:
    # ubuntu-latest (26.04) ships clang-21 and an empty libc++. A cache of
    # /usr/lib/llvm-21 cannot be extracted over that tree ("File exists"), so
    # apt stays the source of the headers.
    - name: Install LLVM 21 libc++ when the headers are missing
      shell: bash
      env:
        LLVM_PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail

        header="/usr/lib/llvm-21/include/c++/v1/filesystem"
        module="/usr/lib/llvm-21/share/libc++/v1/std.cppm"
        if [[ -f "${header}" && -f "${module}" ]]; then
          echo "libc++ headers already present."
        else
          echo "libc++ headers missing — installing ${LLVM_PACKAGES}"
          sudo apt-get update -y
          # shellcheck disable=SC2086
          sudo apt-get install -y ${LLVM_PACKAGES}
        fi

        if [[ -x /usr/bin/clang-21 ]]; then
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-21   100 || true
        fi
        if [[ -x /usr/bin/clang++-21 ]]; then
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100 || true
        fi
        if [[ -x /usr/bin/lld-21 ]]; then
          sudo update-alternatives --install /usr/bin/lld     lld     /usr/bin/lld-21     100 || true
        fi

        if [[ ! -f "${header}" || ! -f "${module}" ]]; then
          echo "ERROR: libc++ headers still missing after install"
          find /usr/lib/llvm-21 -name 'std.cppm' -o -name 'filesystem' | head
          exit 1
        fi

        clang++-21 --version | head -1
        echo "LLVM setup complete."
